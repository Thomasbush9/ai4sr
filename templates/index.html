<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MVP Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="bar">
    <div class="wrap">
      <strong>MVP Chat</strong>
      <div class="radio">
        <label><input type="radio" name="mod" value="literature" checked> Literature Review</label>
        <label><input type="radio" name="mod" value="rag"> RAG (existing docs)</label>
      </div>
      <span id="conv-meta" class="small"></span>
    </div>
  </header>

  <main class="wrap">
    <div id="chat" class="chat"></div>
    <div class="composer">
      <input id="project_id" type="text" placeholder="Project ID (optional)" class="project-input" />
      <input id="paper_limit" type="number" placeholder="Papers" value="10" min="1" max="50" class="limit-input" title="Number of papers to fetch" />
      <input id="input" type="text" placeholder="Type your query..." />
      <button id="send">Send</button>
    </div>
  </main>

  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
