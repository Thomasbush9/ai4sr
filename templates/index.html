<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AI4SR Literature Review</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <div class="brand">
          <div class="brand-icon">📚</div>
          <div class="brand-text">
            <h1>AI4SR</h1>
            <span class="brand-subtitle">Literature Review Assistant</span>
          </div>
        </div>
        
        <div class="mode-selector">
          <div class="mode-tabs">
            <label class="mode-tab">
              <input type="radio" name="mod" value="literature" checked>
              <span class="tab-content">
                <span class="tab-icon">🔍</span>
                <span class="tab-text">Literature Review</span>
              </span>
            </label>
            <label class="mode-tab">
              <input type="radio" name="mod" value="rag">
              <span class="tab-content">
                <span class="tab-icon">💬</span>
                <span class="tab-text">RAG Chat</span>
              </span>
            </label>
          </div>
        </div>
        
        <div class="session-info">
          <button id="sidebar-toggle-header" class="sidebar-toggle-header" title="Toggle Sidebar">
            <span class="hamburger-icon">☰</span>
            <span class="hamburger-text">Menu</span>
          </button>
          <button id="theme-toggle" class="theme-button" title="Toggle Dark Mode">
            <span class="theme-icon">🌙</span>
            <span class="theme-text">Dark</span>
          </button>
          <button id="help-shortcuts" class="help-button" title="Keyboard Shortcuts">
            <span class="help-icon">⌨️</span>
            <span class="help-text">Shortcuts</span>
          </button>
          <button id="settings-button" class="settings-button" title="Settings">
            <span class="settings-icon">⚙️</span>
            <span class="settings-text">Settings</span>
          </button>
          <button id="export-chat" class="export-button" title="Export Chat History">
            <span class="export-icon">📥</span>
            <span class="export-text">Export</span>
          </button>
          <span id="conv-meta" class="session-meta"></span>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <!-- Sidebar -->
      <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <h3>Chat History</h3>
          <div class="sidebar-actions">
            <button id="delete-project" class="delete-project-btn" title="Delete Current Project" style="display: none;">
              <span class="delete-icon">🗑️</span>
            </button>
            <button id="sidebar-toggle" class="sidebar-toggle" title="Toggle Sidebar">
              <span class="toggle-icon">←</span>
            </button>
          </div>
        </div>
        <div class="sidebar-content">
          <div class="sidebar-search">
            <input type="text" id="sidebar-search" placeholder="Search projects..." class="search-input">
          </div>
          <div id="sidebar-projects" class="sidebar-projects">
            <!-- Projects will be loaded here -->
          </div>
        </div>
      </div>

      <div class="chat-container">
        <div id="chat" class="chat"></div>
        
        <div class="input-section">
          <div class="input-controls">
            <div class="control-group">
              <label for="project_id" class="control-label">Project</label>
              <input id="project_id" type="text" placeholder="Enter project name or ID" class="control-input project-input" />
            </div>
            <div class="control-group">
              <label for="paper_limit" class="control-label">Papers</label>
              <input id="paper_limit" type="number" value="10" min="1" max="50" class="control-input limit-input" title="Number of papers to fetch" />
            </div>
          </div>
          
          <div class="composer">
            <div class="input-wrapper">
              <input id="input" type="text" placeholder="Ask about literature, research questions, or search for papers..." class="message-input" />
              <button id="send" class="send-button">
                <span class="send-icon">→</span>
                <span class="send-text">Send</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Floating sidebar toggle button -->
  <button id="sidebar-toggle-float" class="sidebar-toggle-float" title="Toggle Sidebar">
    <span class="float-icon">☰</span>
  </button>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="modal-close" id="settings-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <h3>API Configuration</h3>
          <div class="form-group">
            <label for="openai-key" class="api-key-label">🔑 OpenAI API Key (Required):</label>
            <div class="input-with-toggle">
              <input type="password" id="openai-key" placeholder="sk-proj-..." autocomplete="off" />
              <button type="button" id="toggle-api-key" class="toggle-visibility" title="Show/Hide API Key">👁️</button>
            </div>
            <small>Your API key is stored locally in your browser and never sent to our servers.</small>
          </div>
          <div class="form-group">
            <label for="additional-key" class="api-key-label">🔧 Additional API Key (Optional):</label>
            <div class="input-with-toggle">
              <input type="password" id="additional-key" placeholder="Enter additional API key..." autocomplete="off" />
              <button type="button" id="toggle-additional-key" class="toggle-visibility" title="Show/Hide Additional Key">👁️</button>
            </div>
            <small>Optional API key for additional services or backup authentication.</small>
          </div>
          <div class="form-group">
            <button id="test-api-key" class="test-button">Test API Key</button>
            <span id="api-status" class="api-status"></span>
          </div>
        </div>
        <div class="settings-section">
          <h3>Application Settings</h3>
          <div class="form-group">
            <label for="default-papers">Default Paper Limit:</label>
            <input type="number" id="default-papers" value="10" min="1" max="50" />
          </div>
          <div class="form-group">
            <label for="default-project">Default Project Name:</label>
            <input type="text" id="default-project" placeholder="Enter default project name" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="save-settings" class="save-button">Save Settings</button>
        <button id="cancel-settings" class="cancel-button">Cancel</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
