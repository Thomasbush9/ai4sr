[project]
name = "ai4sr"
version = "0.1.0"
description = "AI-powered Systematic Review Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1.1",
    "gunicorn>=23.0.0",
    "SQLAlchemy>=2.0.41",
    "alembic>=1.15.2",
    "openai>=1.75.0",
    "langchain>=0.3.25",
    "langchain-community>=0.3.24",
    "langchain-core>=0.3.60",
    "langchain-openai>=0.3.17",
    "langchain-text-splitters>=0.3.8",
    "dspy>=2.6.23",
    "faiss-cpu>=1.11.0",
    "scikit-learn>=1.6.1",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "pdfplumber>=0.11.7",
    "PyMuPDF>=1.26.0",
    "pdfminer.six>=20250506",
    "requests>=2.32.3",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.13.4",
    "lxml>=5.4.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.1.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
    "click>=8.1.8",
    "tqdm>=4.67.1",
    "rich>=14.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai4sr", "webapp", "agents", "db", "scripts"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[project.scripts]
ai4sr = "ai4sr.webapp.app:main"