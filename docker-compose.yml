services:
  ai4sr:
    build: .
    container_name: ai4sr_app
    # Load environment variables from .env file
    env_file: .env
    # Override specific environment variables
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5001
      - DATA_DIR=/app/data
    # Remove external port mapping - nginx will handle external access
    expose:
      - "5001"
    # Persist data and logs outside container
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - ai4sr_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: ai4sr_nginx
    depends_on:
      - ai4sr
    ports:
      - "5001:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - ai4sr_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ai4sr_network:
    driver: bridge